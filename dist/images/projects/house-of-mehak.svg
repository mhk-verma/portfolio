<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Restaurant Website Layout -->
  <rect x="20" y="20" width="760" height="410" fill="#1e293b" rx="8"/>
  
  <!-- Navigation -->
  <rect x="20" y="20" width="760" height="50" fill="#CE4DDB" rx="8"/>
  <text x="400" y="52" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">HOUSE OF MEHAK</text>
  
  <!-- Hero Section -->
  <rect x="40" y="80" width="720" height="150" fill="#2d1f1f" rx="4"/>
  <text x="400" y="140" font-family="Arial" font-size="24" fill="#A59ADB" text-anchor="middle" font-weight="bold">Fine Dining Experience</text>
  <text x="400" y="170" font-family="Arial" font-size="14" fill="#F2E1FD" text-anchor="middle">Authentic Cuisine • Elegant Ambiance</text>
  
  <!-- Menu Items -->
  <rect x="40" y="250" width="220" height="160" fill="#1e293b" rx="4"/>
  <rect x="60" y="270" width="180" height="80" fill="#2d1f1f" rx="2"/>
  <text x="150" y="310" font-family="Arial" font-size="12" fill="#A59ADB" text-anchor="middle">Special Dish</text>
  <rect x="60" y="360" width="80" height="30" fill="#CE4DDB" rx="2"/>
  <text x="100" y="380" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Order</text>
  
  <rect x="290" y="250" width="220" height="160" fill="#1e293b" rx="4"/>
  <rect x="310" y="270" width="180" height="80" fill="#2d1f1f" rx="2"/>
  <text x="400" y="310" font-family="Arial" font-size="12" fill="#A59ADB" text-anchor="middle">Chef's Special</text>
  <rect x="310" y="360" width="80" height="30" fill="#CE4DDB" rx="2"/>
  <text x="350" y="380" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Order</text>
  
  <rect x="540" y="250" width="220" height="160" fill="#1e293b" rx="4"/>
  <rect x="560" y="270" width="180" height="80" fill="#2d1f1f" rx="2"/>
  <text x="650" y="310" font-family="Arial" font-size="12" fill="#A59ADB" text-anchor="middle">Desserts</text>
  <rect x="560" y="360" width="80" height="30" fill="#CE4DDB" rx="2"/>
  <text x="600" y="380" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Order</text>
  
  <!-- Decorative Elements -->
  <circle cx="750" cy="100" r="20" fill="#A59ADB" opacity="0.2"/>
  <circle cx="50" cy="400" r="15" fill="#CE4DDB" opacity="0.3"/>
</svg>