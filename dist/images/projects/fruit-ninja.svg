<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Game Canvas -->
  <rect x="20" y="20" width="760" height="410" fill="#1e293b" rx="8"/>
  
  <!-- Game Header -->
  <rect x="20" y="20" width="760" height="50" fill="#334155" rx="8"/>
  <text x="400" y="52" font-family="Arial" font-size="20" fill="#ff6b6b" text-anchor="middle" font-weight="bold">FRUIT NINJA</text>
  
  <!-- Score Display -->
  <rect x="600" y="30" width="100" height="30" fill="#475569" rx="4"/>
  <text x="650" y="50" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Score: 0</text>
  
  <!-- Game Area -->
  <rect x="40" y="90" width="720" height="320" fill="#0f172a"/>
  
  <!-- Fruits -->
  <circle cx="200" cy="200" r="30" fill="#ef4444"/>
  <circle cx="200" cy="200" r="25" fill="#fca5a5"/>
  <ellipse cx="200" cy="180" rx="8" ry="4" fill="#22c55e"/>
  
  <circle cx="400" cy="150" r="25" fill="#f59e0b"/>
  <circle cx="400" cy="150" r="20" fill="#fcd34d"/>
  
  <circle cx="600" cy="250" r="35" fill="#a855f7"/>
  <circle cx="600" cy="250" r="30" fill="#d8b4fe"/>
  
  <circle cx="300" cy="300" r="28" fill="#22c55e"/>
  <circle cx="300" cy="300" r="23" fill="#86efac"/>
  
  <!-- Slicing Effect -->
  <line x1="100" y1="100" x2="700" y2="350" stroke="#CE4DDB" stroke-width="4" opacity="0.5"/>
  <line x1="150" y1="350" x2="650" y2="100" stroke="#CE4DDB" stroke-width="4" opacity="0.3"/>
  
  <!-- Blade Effect -->
  <path d="M500 200 L520 180 L540 200 L520 220 Z" fill="#e2e8f0"/>
  <path d="M500 200 L520 180 L540 200 L520 220 Z" fill="#cbd5e1" transform="rotate(45 520 200)"/>
</svg>