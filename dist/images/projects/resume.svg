<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Browser Window -->
  <rect x="20" y="20" width="760" height="410" fill="#1e293b" rx="8"/>
  
  <!-- Browser Header -->
  <rect x="20" y="20" width="760" height="40" fill="#334155" rx="8"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#22c55e"/>
  
  <!-- URL Bar -->
  <rect x="110" y="32" width="200" height="16" fill="#475569" rx="4"/>
  
  <!-- Website Content -->
  <rect x="40" y="80" width="720" height="340" fill="#0f172a"/>
  
  <!-- Header Section -->
  <rect x="60" y="100" width="200" height="30" fill="#CE4DDB" rx="4"/>
  <rect x="60" y="145" width="400" height="12" fill="#64748b" rx="2"/>
  <rect x="60" y="165" width="300" height="12" fill="#64748b" rx="2"/>
  
  <!-- Resume Preview Box -->
  <rect x="60" y="200" width="300" height="200" fill="#1e293b" rx="4"/>
  <rect x="80" y="220" width="150" height="20" fill="#475569" rx="2"/>
  <rect x="80" y="250" width="200" height="8" fill="#64748b" rx="1"/>
  <rect x="80" y="265" width="180" height="8" fill="#64748b" rx="1"/>
  <rect x="80" y="280" width="160" height="8" fill="#64748b" rx="1"/>
  
  <!-- Sidebar -->
  <rect x="400" y="200" width="140" height="200" fill="#1e293b" rx="4"/>
  <rect x="420" y="220" width="100" height="16" fill="#475569" rx="2"/>
  <rect x="420" y="250" width="80" height="8" fill="#64748b" rx="1"/>
  <rect x="420" y="265" width="90" height="8" fill="#64748b" rx="1"/>
  
  <!-- Buttons -->
  <rect x="400" y="320" width="60" height="30" fill="#e94560" rx="4"/>
  <rect x="480" y="320" width="60" height="30" fill="#475569" rx="4"/>
  
  <!-- Floating Elements -->
  <circle cx="700" cy="120" r="30" fill="#CE4DDB" opacity="0.1"/>
  <circle cx="680" cy="350" r="20" fill="#A59ADB" opacity="0.1"/>
</svg>