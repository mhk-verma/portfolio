<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Browser Window -->
  <rect x="20" y="20" width="760" height="410" fill="#1e293b" rx="8"/>
  
  <!-- Browser Header -->
  <rect x="20" y="20" width="760" height="40" fill="#334155" rx="8"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#22c55e"/>
  
  <!-- URL Bar -->
  <rect x="110" y="32" width="200" height="16" fill="#475569" rx="4"/>
  
  <!-- AI Interface -->
  <rect x="40" y="80" width="720" height="340" fill="#0f172a"/>
  
  <!-- AI Writing Area -->
  <rect x="60" y="100" width="400" height="280" fill="#1e293b" rx="4"/>
  
  <!-- Text Lines -->
  <rect x="80" y="120" width="300" height="12" fill="#64748b" rx="2"/>
  <rect x="80" y="140" width="280" height="12" fill="#64748b" rx="2"/>
  <rect x="80" y="160" width="320" height="12" fill="#64748b" rx="2"/>
  <rect x="80" y="180" width="250" height="12" fill="#64748b" rx="2"/>
  <rect x="80" y="200" width="290" height="12" fill="#64748b" rx="2"/>
  
  <!-- AI Gesture Indicator -->
  <circle cx="550" cy="200" r="60" fill="#CE4DDB" opacity="0.2"/>
  <circle cx="550" cy="200" r="40" fill="#CE4DDB" opacity="0.3"/>
  <circle cx="550" cy="200" r="20" fill="#CE4DDB" opacity="0.5"/>
  
  <!-- Hand Icon -->
  <path d="M530 180 L540 170 L550 180 L560 170 L570 180" stroke="#CE4DDB" stroke-width="3" fill="none"/>
  
  <!-- Status Text -->
  <rect x="500" y="280" width="120" height="20" fill="#A59ADB" rx="4"/>
  <text x="560" y="294" font-family="Arial" font-size="12" fill="white" text-anchor="middle">AI Active</text>
  
  <!-- Control Panel -->
  <rect x="60" y="300" width="400" height="60" fill="#334155" rx="4"/>
  <rect x="80" y="320" width="80" height="20" fill="#475569" rx="2"/>
  <rect x="180" y="320" width="80" height="20" fill="#475569" rx="2"/>
  <rect x="280" y="320" width="80" height="20" fill="#CE4DDB" rx="2"/>
</svg>