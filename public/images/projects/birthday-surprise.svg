<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Celebration App Interface -->
  <rect x="20" y="20" width="760" height="410" fill="#1e293b" rx="8"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" fill="#CE4DDB" rx="8"/>
  <text x="400" y="58" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">🎂 Birthday Surprise 🎉</text>
  
  <!-- Main Content -->
  <rect x="40" y="100" width="720" height="320" fill="#0f172a"/>
  
  <!-- Cake Illustration -->
  <rect x="300" y="150" width="200" height="120" fill="#fef3c7" rx="4"/>
  <rect x="280" y="130" width="240" height="30" fill="#fcd34d" rx="4"/>
  
  <!-- Candles -->
  <rect x="350" y="100" width="8" height="30" fill="#fef3c7"/>
  <rect x="396" y="100" width="8" height="30" fill="#fef3c7"/>
  <rect x="442" y="100" width="8" height="30" fill="#fef3c7"/>
  
  <!-- Flames -->
  <ellipse cx="354" cy="95" rx="6" ry="10" fill="#f59e0b"/>
  <ellipse cx="400" cy="95" rx="6" ry="10" fill="#f59e0b"/>
  <ellipse cx="446" cy="95" rx="6" ry="10" fill="#f59e0b"/>
  
  <!-- Confetti -->
  <circle cx="200" cy="180" r="8" fill="#ef4444"/>
  <circle cx="600" cy="200" r="6" fill="#22c55e"/>
  <circle cx="250" cy="300" r="10" fill="#3b82f6"/>
  <circle cx="550" cy="280" r="7" fill="#a855f7"/>
  <rect x="150" y="250" width="15" height="15" fill="#f59e0b" transform="rotate(45 157 257)"/>
  <rect x="630" y="180" width="12" height="12" fill="#ec4899" transform="rotate(30 636 186)"/>
  
  <!-- Message Box -->
  <rect x="250" y="300" width="300" height="80" fill="#334155" rx="4"/>
  <text x="400" y="340" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Make a Wish!</text>
  <rect x="320" y="355" width="160" height="20" fill="#A59ADB" rx="2"/>
  <text x="400" y="369" font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">Celebrate Now</text>
</svg>